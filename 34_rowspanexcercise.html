<!doctype html>
<html>
  <head>
    <style>
      table,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <h2>Cell that spans two rows</h2>
    <p>To make a cell span more than one row, use the rowspan attribute.</p>

    <table style="width: 100%">
      <tr>
        <th>A</th>
        <th>B</th>
        <th colspan="2">C</th>
      </tr>
      <tr>
        <th rowspan="2">D</th>  
        <th>E</th>
        <th rowspan="2">G</th>
        <th rowspan="2">H</th>
      </tr>
      <tr>
        <th>F</th>
      </tr>
      <tr>
        <th colspan="4">I</th>
      </tr>


    </table>
  </body>
</html>
