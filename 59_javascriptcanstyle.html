<!doctype html>
<html>
  <body>
    <h1>My First JavaScript</h1>

    <p id="demo">JavaScript can change the style of an HTML element.</p>

    <script>
      function myFunction() {
        document.getElementById("demo").style.fontSize = "25px"; // font-size:25px;
        document.getElementById("demo").style.color = "red"; // color: red;
        document.getElementById("demo").style.backgroundColor = "yellow"; // background-color: yellow;
        document.getElementById("demo").style.border = "2px solid black"; // border: 2px solid black;
        document.body.style.backgroundColor = "pink"; // background-color: pink;
      }
    </script>

    <button type="button" onclick="myFunction()">Click Me!</button>
  </body>
</html>
