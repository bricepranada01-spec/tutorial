<!doctype html>
<html>
  <head>
    <style>
      .testbtn {
        background-color: blue;
        color: white;
        font-size: 30px;
        padding: 15px;
        border: 1px solid red;
        border-radius: 20px;
        cursor: pointer;
      }

      .testbtn:hover {
        background-color: rgb(6, 6, 215);
      }
    </style>
  </head>
  <body>
    <h1>HTML Buttons</h1>

    <p>Default button with no styling:</p>
    <button>Click me</button>

    <p>Styled button:</p>
    <button class="testbtn">Pogi's Button</button>

    <p>A disabled button is unclickable:</p>
    <button disabled>Disabled Button</button>

    <p>
      The button uses the <code>onclick</code> attribute to run JavaScript. When
      you click the button, it shows an alert message.
    </p>

    <button onclick="alert('Hello!')">Click Me</button>

    


  </body>
</html>
