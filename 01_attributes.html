<!DOCTYPE html>
<html>

<body>

    <h2>The href Attribute</h2>

    <p>HTML links are defined with the a tag. The link address is specified in the href attribute:</p>

    <a href="https://www.jw.org/tl">Visit JW ORG</a>

    <h2>The src Attribute</h2>
    <p>HTML images are defined with the img tag, and the filename of the image source is specified in the src attribute:
    </p>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTZA3EnMQLT0ousS1Nr-v-89d8cM_fbt2uMug&s"
        alt="basketball" />

    <img src="./images/adobo.jpg" width="400" />

    <img src="img_girl.jpg" alt="Girl with a jacket" />

    <p style="color:blue; font-size: 200px;">This is a blue paragraph.</p>

    <h2 title="Pinaka pogi sa lahat">Abel Magana</h2>


</body>

</html>
