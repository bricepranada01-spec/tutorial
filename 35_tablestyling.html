<!doctype html>
<html>
  <head>
    <style>
      table {
        border-collapse: collapse;
        width: 100%;
      }

      th,
      td {
        text-align: left;
        padding: 8px;
      }

      tr:nth-child(odd) {
        background-color: blue;
        color: white;
      }
      tr:nth-child(even) {
        background-color: yellow;
      }

      tr:first-child {
        background-color: red;
      }

      th:nth-child(even),
      td:nth-child(even) {
        background-color: green;
      }

      tr:hover, td:hover, th:hover {
        background-color: #000000;
      }
    </style>
  </head>
  <body>
    <h2>Zebra Striped Table</h2>
    <p>
      For zebra-striped tables, use the nth-child() selector and add a
      background-color to all even (or odd) table rows:
    </p>

    <table>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Points</th>
        <th>Remarks</th>
      </tr>
      <tr>
        <td>Peter</td>
        <td>Griffin</td>
        <td>$100</td>
        <td>passed</td>
      </tr>
      <tr>
        <td>Lois</td>
        <td>Griffin</td>
        <td>$150</td>
        <td>failed</td>
      </tr>
      <tr>
        <td>Joe</td>
        <td>Swanson</td>
        <td>$300</td>
        <td>win</td>
      </tr>
      <tr>
        <td>Cleveland</td>
        <td>Brown</td>
        <td>$250</td>
        <td>lose</td>
      </tr>
    </table>
  </body>
</html>
